[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "sevenfilm-ai-editor"
version = "0.1.0"
description = "Local-first, explainable rough-cut assistant for wedding editors."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.8,<3.0",
  "scenedetect[opencv]>=0.6.4,<1.0",
  "librosa>=0.10.2,<1.0",
  "numpy>=1.26,<3.0",
  "pillow>=10,<13",
  "torch>=2.4,<3",
  "transformers>=4.45,<6",
  "OpenTimelineIO>=0.16,<1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9.0", "httpx>=0.27,<1.0", "ruff>=0.6,<1.0"]

[tool.hatch.build.targets.wheel]
packages = ["apps/api/sevenfilm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["apps/api"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
# The Resolve probes exist to find out what an undocumented remote proxy does, including how
# it fails. A call that raises is a result to be written down, not a bug to let through, so
# these files catch broadly on purpose.
"tools/resolve/*.py" = ["BLE001"]
